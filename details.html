<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CookieBuddy Details</title>
    <link rel="stylesheet" href="src/styles.css">
  </head>
  <body class="details-page">
    <main class="details-shell">
      <header class="hero wide">
        <div>
          <p class="eyebrow">CookieBuddy</p>
          <h1 data-i18n="detailsTitle">Scan details</h1>
          <p class="muted" data-i18n="detailsIntro">This page shows the last analysis stored locally by the extension.</p>
        </div>
        <label class="language-toggle">
          <span data-i18n="languageLabel">Language</span>
          <select id="languageSelect" aria-label="Language">
            <option value="en">English</option>
            <option value="de">Deutsch</option>
          </select>
        </label>
      </header>

      <section class="card">
        <h2 data-i18n="summaryHeading">Summary</h2>
        <pre id="detailsOutput" class="json-output">Loading...</pre>
      </section>
    </main>

    <script src="src/details.js" type="module"></script>
  </body>
</html>
