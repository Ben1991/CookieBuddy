<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title data-i18n="detailsDocumentTitle">CookieBuddy – Scan details</title>
    <link rel="stylesheet" href="src/styles.css">
  </head>
  <body class="details-page">
    <main class="details-shell cb-details">
      <header class="cb-details-header">
        <div>
          <h1>Technische Details</h1>
          <p class="cb-muted" data-i18n="detailsIntro">Auffällige Ergebnisse zuerst · Scan lokal gespeichert</p>
        </div>
        <span class="cb-badge local" data-i18n="localOnlyBadge">Stored locally</span>
        <label class="cb-language">
          <span class="sr-only" data-i18n="languageLabel">Language</span>
          <select id="languageSelect" data-i18n-aria-label="languageAriaLabel">
            <option value="en">EN</option>
            <option value="de">DE</option>
          </select>
        </label>
      </header>
      <section id="detailsOutput" class="cb-details-output" aria-live="polite">Loading...</section>
      <section id="sendDeltaMailActions" class="cb-card cb-mail-actions" aria-labelledby="sendDeltaMailHeading" aria-describedby="sendDeltaMailHint" hidden>
        <h2 id="sendDeltaMailHeading" data-i18n="sendDeltaMailHeading">Send delta by email</h2>
        <p id="sendDeltaMailHint" class="cb-muted" data-i18n="sendDeltaMailHint">A mail draft opens with the audit report. Please review and adjust the text before sending.</p>
      </section>
    </main>
    <script src="src/details.js" type="module"></script>
  </body>
</html>
