<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CookieBuddy Details</title>
    <link rel="stylesheet" href="src/styles.css">
  </head>
  <body class="details-page">
    <main class="details-shell">
      <header class="hero wide">
        <div>
          <p class="eyebrow">CookieBuddy</p>
          <h1 data-i18n="detailsTitle">Scan details</h1>
          <p class="muted" data-i18n="detailsIntro">This page shows the last analysis stored locally by the extension.</p>
        </div>
        <label class="language-toggle">
          <span data-i18n="languageLabel">Language</span>
          <select id="languageSelect" aria-label="Language">
            <option value="en">English</option>
            <option value="de">Deutsch</option>
          </select>
        </label>
      </header>

      <section class="card details-card">
        <div class="details-section-heading">
          <div>
            <p class="eyebrow" data-i18n="deltaReportKicker">Delta audit</p>
            <h2 data-i18n="summaryHeading">Summary</h2>
          </div>
          <span class="details-local-badge" data-i18n="localOnlyBadge">Stored locally</span>
        </div>
        <div id="sendDeltaMailActions" class="delta-mail-actions" aria-labelledby="sendDeltaMailHeading" aria-describedby="sendDeltaMailHint" hidden>
          <div>
            <h3 id="sendDeltaMailHeading" data-i18n="sendDeltaMailHeading">Send delta by email</h3>
            <p id="sendDeltaMailHint" class="muted" data-i18n="sendDeltaMailHint">A mail draft opens with the audit report. Please review and adjust the text before sending.</p>
          </div>
        </div>
        <div id="detailsOutput" class="json-output">Loading...</div>
      </section>
    </main>

    <script src="src/details.js" type="module"></script>
  </body>
</html>
